<div class="card flex justify-center">
  <div class="flex flex-col items-center">
    <div class="font-bold text-xl mb-2">Authenticate Your Account</div>
    <p class="text-muted-color block mb-8">Please enter the code sent to your email.</p>

    <!-- FIXED: Added ngSubmit tracking to the structural form layer -->
    <form [formGroup]="form" (ngSubmit)="submitOtp()">

      <p-inputotp
        [length]="4"
        size="large"
        formControlName="Otpcode"
        [disabled]="isSubmitting"
        [integerOnly]="true">
        <ng-template #input let-token let-events="events" let-index="index">
          <input
            type="text"
            [maxLength]="1"
            (input)="events.input($event)"
            (keydown)="events.keydown($event)"
            [attr.value]="token"
            class="w-12 h-12 text-center p-1 text-lg border rounded"
          />
          <div *ngIf="index === 2" class="px-2 flex items-center justify-center">
            <i class="pi pi-minus text-muted-color"></i>
          </div>
        </ng-template>
      </p-inputotp>

      <!-- Time Tracking Status Indicator Info Window Area -->
      <div class="text-center mt-4 text-sm text-muted-color">
        <span *ngIf="count > 0">Code expires in: <strong>{{ formatTime }}</strong></span>
        <span *ngIf="count === 0" class="text-danger">
          Code expired. <button type="button" class="underline text-primary" (click)="resendOTP()">Resend Code</button>
        </span>
      </div>

      <div class="flex justify-center mt-6 self-stretch">
        <p-button label="Submit Code" type="submit" [disabled]="form.invalid || isSubmitting" class="w-full" />
      </div>
    </form>
  </div>
</div>
