<div class="grid grid-cols-1 md:grid-cols-1 lg:grid-col-1 items-center w-full  px-8 ">
  <div class="">
    <div class="relative overflow-hidden rounded-xl  cursor-pointer h-64 ">
      <img class="absolute  inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" [ngSrc]="collections[0].image" fill />
         <div class="absolute flex items-center justify-center inset-0 bg-gradient-to-t from-[#22005d]/80 to-transparent  ">

         <div class="grid grid-cols-1 gap-2 items-center">
            <h3 class="text-2xl font-semibold ">{{ collections[0].label }}</h3>
            <p class="text-sm  mt-1">{{ collections[0].description }}</p>


        <p-button label="Join the Collective" class="mt-2 "  icon="pi pi-shop"> </p-button>
         </div>

        </div>
    </div>
  </div>
</div>
