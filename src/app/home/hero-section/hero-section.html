<div class="relative overflow-hidden rounded-3xl border border-white/10 bg-slate-900/40 p-8 md:p-12 backdrop-blur-md">

  <div class="absolute -right-10 -top-20 h-72 w-72 pointer-events-none rounded-full bg-primary opacity-25 blur-3xl
              [animation:pulse_8s_ease-in-out_infinite]"></div>
  <div class="absolute -bottom-20 left-[30%] h-56 w-56 pointer-events-none rounded-full bg-primary opacity-20 blur-3xl
              [animation:pulse_10s_ease-in-out_infinite_2s]"></div>

  <div class="relative z-10 grid grid-cols-1 items-center gap-8 lg:grid-cols-2 lg:gap-12">

    <div class="flex flex-col items-start gap-5 text-left order-2 lg:order-1">
      <div class="flex items-center">
        <span class="rounded-full bg-primary/20 px-4 py-1.5 text-xs font-bold tracking-wider  uppercase">
          New Season 2024
        </span>
      </div>

      <h1 class="text-3xl font-bold leading-snug tracking-tight   sm:text-4xl xl:text-5xl">
        Welcome to Ecom
      </h1>

      <p class="max-w-md text-base leading-relaxed text-slate-300 opacity-90">
        Experience the intersection of high-performance design and minimalist aesthetic.
        Quality crafted for your daily journey.
      </p>

      <div class="pt-2">
        <p-button
          label="Shop Now"
          class="mt-2 inline-block transition-transform duration-200 hover:scale-105"
          (onClick)="toproductPage()"
          icon="pi pi-shop">
        </p-button>
      </div>
    </div>

    <div class="relative aspect-square w-full overflow-hidden rounded-2xl border-primary/20 order-1 lg:order-2">
      <img
        ngSrc="https://lh3.googleusercontent.com/aida-public/AB6AXuBDjMWaCQWkmbzoZsQw6jyKItAeMcazydnlvMmrTnuOaj19xSdt8-cKICbfrOKEDbDznWm23qhkyzqCg68agSp9DvjF8FfUBBysHA9zryeQNSO_Li6HJwglbXzfGuzTTiJnd8jWqBzGhA08v0X2ayCGcU6--ekytjm-9lWAsYB0ggxrA-S31p_HINOCFjTJRfOxWvkNfNQUxHgpd84_AWvUxs8jGgkYAiz0FT7ZdsvUpgzXG0uX0sDUUXrYW--J4LPZCVifjsWj1YQ"
        alt="Featured Product"
        width="1000"
        height="1000"
        priority
        class="h-full w-full object-cover transition-transform duration-700 hover:scale-105"
      />
    </div>

  </div>
</div>
