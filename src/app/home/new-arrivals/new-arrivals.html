 <div class="p-2">
  <h1 class="text-3xl font-bold p-2">Top rated</h1>
 </div>

 <p-carousel
    [value]="relatedProducts"
    [numVisible]="3"
    [numScroll]="2"
    [circular]="true"
    [autoplayInterval]="3000"
    class="mt-4 "
  >
    <ng-template let-product #item>
      <div class=" m-2 p-4 cursor-pointer shrink-1 shadow-md/15 hover:shadow-md/30 transition-shadow duration-300 rounded-lg ">


        <app-product-gallery [photos]="product.photos"
          [alt]="product.name"
          [autoPlay]="true" />

        <!-- Name -->
        <p class="font-semibold mt-2">{{ product.name }}</p>

        <!-- Rating -->
        <p-rating class="mt-2" disabled="true"  [(ngModel)]="product.averageStars" />

        <!-- Price -->
        <div class="flex justify-between items-center mt-2">
          <span class="font-bold text-primary text-xl">{{ product.newprice }}</span>
          <span class="line-through opacity-65 text-sm">{{ product.oldPrice }}</span>
        </div>

      </div>
    </ng-template>
  </p-carousel>
