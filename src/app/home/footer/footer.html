<footer class="w-full py-10 mt-16 bg-surface-container-high border-t border-outline-variant">
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 px-4 md:px-8 max-w-7xl mx-auto">

    <!-- Brand -->
    <div class="space-y-4">
      <h2 class="text-xl font-bold text-purple-600">Lumina Commerce</h2>
      <p class="text-sm ">
        Quality products for quality lives. We craft essentials that matter.
      </p>
      <div class="flex gap-3">
        <button
          *ngFor="let icon of socialIcons"
          class="material-symbols-outlined  hover:text-purple-600 transition-colors"
        >
          {{ icon }}
        </button>
      </div>
    </div>

    <!-- Shop -->
    <div class="space-y-4">
      <h3 class="text-sm font-bold ">Shop</h3>
      <ul class="space-y-2">
        <li
          *ngFor="let link of shopLinks"
          class="text-sm  hover:text-purple-600 underline transition-all cursor-pointer"
        >
          {{ link }}
        </li>
      </ul>
    </div>

    <!-- Company -->
    <div class="space-y-4">
      <h3 class="text-sm font-bold ">Company</h3>
      <ul class="space-y-2">
        <li
          *ngFor="let link of companyLinks"
          class="text-sm  hover:text-purple-600 underline transition-all cursor-pointer"
        >
          {{ link }}
        </li>
      </ul>
    </div>

    <!-- Newsletter -->
    <div class="space-y-4">
      <h3 class="text-sm font-bold ">Newsletter</h3>
      <p class="text-sm ">Get updates on new drops and collections.</p>
      <div class="flex gap-2">


        <p-button
          label="Join"
          styleClass="bg-purple-600  px-4 py-2 rounded-lg text-sm font-semibold hover:opacity-90 transition-opacity"
        />
      </div>
    </div>

  </div>

  <!-- Bottom bar -->
  <div class="max-w-7xl mx-auto px-4 md:px-8 mt-8 pt-6 border-t border-outline-variant text-center">
    <p class="text-sm  opacity-75">© 2024 Lumina Commerce. All rights reserved.</p>
  </div>
</footer>
