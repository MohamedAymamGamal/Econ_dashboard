
<section class="py-16 ">
  <div class="w-full mx-auto px-4 md:px-8">

    <!-- Header -->
    <div class="mb-8 text-center lg:text-left">
      <h2 class="text-3xl font-bold  ">Featured Collections</h2>
      <p class=" mt-1 opacity-70">Curated selections for every lifestyle aspect.</p>
    </div>

    <!-- Grid -->
    <div class="grid grid-cols-1 md:grid-cols-4 lg:grid-cols-12 gap-4 h-auto lg:h-[600px]">

      <!-- Apparel — large -->
      <div
        class="md:col-span-2 lg:col-span-8 group relative overflow-hidden rounded-xl bg-gray-100 cursor-pointer"
      >
        <img
          [alt]="collections[0].alt"
          [ngSrc]="collections[0].image"
          class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
          fill
        />
        <div class="absolute inset-0 bg-gradient-to-t from-[#22005d]/80 to-transparent flex flex-col justify-end p-6">
          <h3 class="text-2xl font-semibold ">{{ collections[0].label }}</h3>
          <p class="text-sm  mt-1">{{ collections[0].description }}</p>
        </div>
      </div>

      <!-- Tech — small -->
      <div
        class="md:col-span-2 lg:col-span-4 group relative overflow-hidden rounded-xl bg-gray-100 cursor-pointer"
      >
        <img
          [alt]="collections[1].alt"
          [ngSrc]="collections[1].image"
          class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
          fill
        />
        <div class="absolute inset-0 bg-gradient-to-t from-[#22005d]/80 to-transparent flex flex-col justify-end p-6">
          <h3 class="text-2xl font-semibold ">{{ collections[1].label }}</h3>
          <p class="text-sm  mt-1">{{ collections[1].description }}</p>
        </div>
      </div>

      <!-- Accessories — full width -->
      <div
        class="md:col-span-4 lg:col-span-12 group relative overflow-hidden rounded-xl bg-gray-100 cursor-pointer h-64 lg:h-auto"
      >
        <img
          [alt]="collections[2].alt"
          [ngSrc]="collections[2].image"
          class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
          fill
        />
        <div class="absolute inset-0 bg-gradient-to-t from-[#22005d]/80 via-transparent to-transparent flex flex-col justify-end p-6">
          <h3 class="text-2xl font-semibold ">{{ collections[2].label }}</h3>
          <p class="text-sm  mt-1">{{ collections[2].description }}</p>
        </div>
      </div>

    </div>
  </div>
</section>
