<div class="rounded-md shadow-md/20 p-8">
  <div class="flex items-center justify-between">
    <h2 class="text-2xl font-bold text-secondary">Customer Reviews</h2>
    <p-button label="Write a Review" icon="pi pi-pencil " (onClick)="addReview()"></p-button>
  </div>
  <div class="grid md:grid-cols-1 lg:grid-cols-2 sm:grid-cols-1 gap-4 p-2 m-4">
    <div
      class="shadow-20 border-color border-b rounded-lg shadow-md/10 hover:shadow-md/20 p-4 mb-4 border-primary transition duration-300 ease-in-out"
      *ngFor="let rating of ratings"
    >
      <div>
        <div class="grid grid-cols-1 gap-2">
          <div class="flex justify-between items-center">
            <h1>John Doe</h1>
            <p class="text-primary">{{ rating.createdAt | date: 'dd/MM/yyyy' }}</p>
          </div>
          <p-rating [(ngModel)]="rating.stars" size="large" readonly="true" disabled="true">
          </p-rating>
          <p class="text-sm opacity-70 mt-1">{{ rating.review }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
